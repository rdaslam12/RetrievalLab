<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="258" viewBox="0 0 1200 258" role="img" aria-labelledby="title description">
  <title id="title">RetrievalLab: from documents to measurable retrieval results</title>
  <desc id="description">An animated four-step pipeline: add documents, search by keyword or meaning, optionally rerank results, and compare evaluation metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e18"/>
      <stop offset="62%" stop-color="#111a31"/>
      <stop offset="100%" stop-color="#08101b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171f34"/><stop offset="100%" stop-color="#101624"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#65e9f5"/><stop offset="100%" stop-color="#8ab4f8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8ab4f8" stroke-opacity=".055"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .eyebrow { fill:#a2b7d5; font-size:12px; letter-spacing:2.1px; font-weight:700; }
      .step { fill:#f1f5ff; font-size:24px; font-weight:650; }
      .small { fill:#a7b6ce; font-size:14px; }
      .num { fill:#79dcf4; font-family:monospace; font-size:12px; font-weight:700; }
      .box { fill:url(#card); stroke:#7da9f6; stroke-opacity:.19; }
      .signal { fill:#85c1fc; animation: glow 3.2s ease-in-out infinite; }
      .signal.s2 { animation-delay:.8s; }.signal.s3 { animation-delay:1.6s; }.signal.s4 { animation-delay:2.4s; }
      .shimmer { animation: shimmer 5s ease-in-out infinite; }
      @keyframes glow { 0%,100% {opacity:.32} 50% {opacity:1} }
      @keyframes shimmer { 0%,100% {opacity:.13} 50% {opacity:.33} }
      @media (prefers-reduced-motion: reduce) { .signal,.shimmer {animation:none} }
    </style>
  </defs>
  <rect width="1200" height="258" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="258" rx="22" fill="url(#grid)"/>
  <circle cx="985" cy="35" r="190" fill="#416dcc" opacity=".15" filter="url(#blur)"/>
  <text class="eyebrow" x="45" y="37">RETRIEVALLAB  /  HOW SEARCH GETS EVALUATED</text>
  <g transform="translate(44 69)">
    <rect class="box" width="266" height="150" rx="15"/>
    <text class="num" x="22" y="31">01  INPUT</text>
    <text class="step" x="22" y="70">Add documents</text>
    <text class="small" x="22" y="101">PDF · DOCX · TXT · JSONL</text>
    <circle class="signal" cx="238" cy="27" r="5"/>
    <path d="M22 121H123" stroke="#8ab4f8" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(326 69)">
    <rect class="box" width="266" height="150" rx="15"/>
    <text class="num" x="22" y="31">02  RETRIEVE</text>
    <text class="step" x="22" y="70">Search smarter</text>
    <text class="small" x="22" y="101">Dense · BM25 · Hybrid</text>
    <circle class="signal s2" cx="238" cy="27" r="5"/>
    <path d="M22 121H102" stroke="#8ab4f8" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>
    <path d="M22 121H72" stroke="#8ab4f8" stroke-width="3" stroke-linecap="round" class="shimmer"/>
  </g>
  <g transform="translate(608 69)">
    <rect class="box" width="266" height="150" rx="15"/>
    <text class="num" x="22" y="31">03  REFINE</text>
    <text class="step" x="22" y="70">Rerank results</text>
    <text class="small" x="22" y="101">Optional Cross-Encoder</text>
    <circle class="signal s3" cx="238" cy="27" r="5"/>
    <path d="M22 121H142" stroke="#8ab4f8" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(890 69)">
    <rect class="box" width="266" height="150" rx="15"/>
    <text class="num" x="22" y="31">04  EVALUATE</text>
    <text class="step" x="22" y="70">Compare models</text>
    <text class="small" x="22" y="101">Recall · MRR · NDCG</text>
    <circle class="signal s4" cx="238" cy="27" r="5"/>
    <path d="M22 121H104" stroke="#8ab4f8" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g stroke="url(#trail)" stroke-width="2" opacity=".66" stroke-linecap="round">
    <path d="M311 144H324M319 139L324 144L319 149" fill="none"/>
    <path d="M593 144H606M601 139L606 144L601 149" fill="none"/>
    <path d="M875 144H888M883 139L888 144L883 149" fill="none"/>
  </g>
  <g fill="#77d6ed">
    <circle cx="316" cy="144" r="3"><animate attributeName="cx" values="311;324;311" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="598" cy="144" r="3"><animate attributeName="cx" values="593;606;593" dur="3s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="144" r="3"><animate attributeName="cx" values="875;888;875" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <rect x=".5" y=".5" width="1199" height="257" rx="21.5" fill="none" stroke="#8ab4f8" stroke-opacity=".14"/>
</svg>